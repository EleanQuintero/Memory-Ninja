# Build-script approvals (pnpm 11). true = run install/build scripts, false = skip.
#   sharp / unrs-resolver -> native binaries needed at build time.
#   @clerk/shared / esbuild / msgpackr-extract -> JS fallback exists, script not needed.
allowBuilds:
  '@clerk/shared': false
  esbuild: false
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true

overrides:
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  playwright: 1.60.0
  playwright-core: 1.60.0
  '@playwright/test': 1.60.0
  # react-scan depends on react-doctor@latest, which publishes daily and would
  # otherwise break CI installs until each release ages past the policy window.
  react-doctor: 0.5.1
  oxlint-plugin-react-doctor: 0.5.1
  deslop-js: 0.0.23
  baseline-browser-mapping: 2.10.36
  '@emnapi/runtime': 1.11.0

# Supply-chain guard: do not install package versions published less than 2 days ago.
minimumReleaseAge: 2880 # 2 days
